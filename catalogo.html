<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Catálogo de Autos</title>
<style>
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: #f4f6f9; margin: 0; padding: 2rem; }
  h1 { text-align: center; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1.2rem; max-width: 1100px; margin: 2rem auto; }
  .card { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
  .card img { width: 100%; height: 180px; object-fit: cover; background: #ddd; }
  .card-body { padding: 1rem; }
  .precio { font-size: 1.2rem; font-weight: bold; color: #1a3c6e; }
</style>
</head>
<body>
  <h1>Catálogo de Autos</h1>
  <div class="grid" id="grid"></div>

  <script>
    fetch("/data/autos.json?_=" + Date.now())
      .then((r) => r.json())
      .then((autos) => {
        const grid = document.getElementById("grid");
        autos.filter(a => a.disponible !== false).forEach((a) => {
          const div = document.createElement("div");
          div.className = "card";
          div.innerHTML = `
            <img src="${a.foto || 'fotos/placeholder.jpg'}" alt="${a.marca} ${a.modelo}" />
            <div class="card-body">
              <h3>${a.marca} ${a.modelo} ${a.anio}</h3>
              <p class="precio">$${Number(a.precio).toLocaleString("es-MX")}</p>
              <p>${a.kilometraje ? a.kilometraje.toLocaleString() + " km" : ""} · ${a.color || ""}</p>
              <p>${a.descripcion || ""}</p>
            </div>
          `;
          grid.appendChild(div);
        });
      });
  </script>
</body>
</html>
