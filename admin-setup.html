<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Setup inicial — Autos Bravo</title>
<style>
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: #f4f6f9; margin: 0; }
  .wrap { max-width: 420px; margin: 4rem auto; background: white; padding: 2rem; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
  h1 { font-size: 1.2rem; margin: 0 0 .3rem; }
  p.aviso { color: #6b7280; font-size: .85rem; margin: 0 0 1.4rem; }
  label { display: block; font-size: .85rem; margin: .8rem 0 .3rem; }
  input { width: 100%; padding: .6rem .7rem; border: 1px solid #d1d5db; border-radius: 6px; font-size: .95rem; box-sizing: border-box; }
  button { width: 100%; margin-top: 1.2rem; padding: .7rem; background: #1a3c6e; color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  #msg { margin-top: 1rem; font-size: .88rem; }
  .ok { color: #15803d; }
  .error { color: #b91c1c; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Crear el primer owner</h1>
  <p class="aviso">
    Este formulario solo funciona <strong>una vez</strong> — en cuanto exista un owner, se bloquea solo.
    Necesitas el <code>SETUP_TOKEN</code> que vas a configurar en Netlify (Environment variables).
  </p>

  <form id="form-setup">
    <label>Tu correo (serás el owner principal)</label>
    <input type="email" id="email" required />

    <label>Contraseña (mínimo 8 caracteres, al menos un número)</label>
    <input type="password" id="password" required minlength="8" />

    <label>Setup token</label>
    <input type="password" id="setupToken" required />

    <button type="submit" id="btn">Crear owner</button>
  </form>

  <p id="msg"></p>
</div>

<script>
  const form = document.getElementById("form-setup");
  const msg = document.getElementById("msg");
  const btn = document.getElementById("btn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    btn.disabled = true;
    msg.textContent = "Creando...";
    msg.className = "";

    try {
      const res = await fetch("/api/admin-setup", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          email: document.getElementById("email").value,
          password: document.getElementById("password").value,
          setupToken: document.getElementById("setupToken").value,
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Error desconocido");

      msg.textContent = "✅ " + data.message;
      msg.className = "ok";
      form.reset();
      setTimeout(() => (window.location.href = "admin.html"), 2000);
    } catch (err) {
      msg.textContent = "❌ " + err.message;
      msg.className = "error";
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
